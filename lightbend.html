<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lightbend</title>
<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #070d17;
    color: #e8e2d0;
    font-family: Georgia, "Times New Roman", serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    box-sizing: border-box;
  }
  h1 {
    font-weight: normal;
    letter-spacing: 3px;
    margin: 8px 0 4px;
  }
  #info {
    color: #8a95a6;
    min-height: 1.4em;
    margin-bottom: 16px;
    text-align: center;
  }
  #board {
    display: grid;
    gap: 6px;
  }
  .cell {
    width: min(12vw, 72px);
    height: min(12vw, 72px);
    box-sizing: border-box;
    border: 2px solid #24344a;
    border-radius: 8px;
    background: #14202f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: min(8vw, 40px);
    user-select: none;
    transition: background 0.15s, box-shadow 0.15s, border-color 0.15s;
  }
  .cell.wall { background: #0a111b; }
  .cell.fog { background: #1b2430; color: #7f8c9a; }
  .cell.fixed { color: #c9b68a; }
  .cell.mirror { cursor: pointer; color: #7fa6c9; }
  .cell.mirror:hover { border-color: #3d5a7a; }
  .cell.lit {
    background: #3a3014;
    border-color: #f5d76e;
    box-shadow: 0 0 12px rgba(245, 215, 110, 0.45);
  }
  .cell.mirror.lit { color: #f5d76e; }
  #buttons { margin-top: 20px; display: flex; gap: 10px; }
  button {
    font: inherit;
    background: #1d2c40;
    color: #e8e2d0;
    border: 1px solid #24344a;
    border-radius: 8px;
    padding: 8px 16px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.4; cursor: default; }
  #levels {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 18px;
    max-width: 460px;
  }
  .level-btn { min-width: 64px; padding: 6px 8px; font-size: 16px; }
  .level-btn.current { border-color: #f5d76e; }
  .level-btn small { display: block; color: #f5d76e; font-size: 12px; }
</style>
</head>
<body>
<h1>LIGHTBEND</h1>
<div id="info"></div>
<div id="board"></div>
<div id="levels"></div>
<div id="buttons">
  <button id="undo" disabled>Undo</button>
  <button id="reset">Reset</button>
  <button id="next" disabled>Next level</button>
</div>
<script>
(function () {
  // ---------- Levels ----------
  // S = lamp (the light starts here, pointing right)
  // T = harbor (the light must reach this)
  // # = rock (the light stops here)
  // / and \ = mirrors. Click one to turn it. Light bounces off it.
  // . = empty space
  const LEVELS = [
    [
      'S../.',
      '...\\T'
    ],
    [
      'S./..',
      '../.T',
      '#...#'
    ],
    [
      'S.../.',
      '.\\..\\.',
      '.T....'
    ],
    [
      'S../..',
      '.#....',
      '\\..\\..',
      '/....T'
    ],
    [
      '.\\..T.',
      'S../..',
      '..#...',
      './.\\..'
    ],
    [
      'S~/..',
      '.~...',
      '../~T'
    ],
    [
      'S.G..',
      '\\.\\..',
      'T....'
    ]
  ];

  // The fewest clicks that solve each level. Star ratings are based on this number.
  const PAR = [1, 2, 3, 4, 4, 2, 2];

  // Fog (~) dims the light. After this many fog cells in one beam, the light fades out.
  const FOG_LIMIT = 2;

  // 3 stars: at par. 2 stars: up to 2 extra moves. 1 star: anything more.
  function starsFor(n) {
    const extra = n - PAR[level];
    if (extra <= 0) return 3;
    if (extra <= 2) return 2;
    return 1;
  }

  // ---------- Setup ----------
  const boardEl = document.getElementById('board');
  const infoEl = document.getElementById('info');
  const nextBtn = document.getElementById('next');
  const resetBtn = document.getElementById('reset');
  const undoBtn = document.getElementById('undo');

  let level = 0;
  let grid = [];      // grid[y][x] holds the character for that cell
  let W = 0, H = 0;
  let lampX = 0, lampY = 0;
  let moves = 0;
  let solved = false;
  let cellEls = [];   // the HTML element for each cell, in order
  let history = [];   // copies of the grid before each move, so Undo can go back
  let progress = { unlocked: 0, stars: [] };   // best stars per level, and how many levels are open

  function key(x, y) { return x + ',' + y; }

  // Follow the light from the lamp. Returns the cells it passes and whether it reached the harbor.
  function traceLight() {
    const lit = new Set();
    lit.add(key(lampX, lampY));
    let x = lampX, y = lampY;
    let dx = 1, dy = 0;               // the light starts by moving right
    let reached = false;
    let fogSeen = 0;
    for (let steps = 0; steps < 200; steps++) {   // the limit stops endless loops
      x += dx;
      y += dy;
      if (x < 0 || y < 0 || x >= W || y >= H) break;
      const ch = grid[y][x];
      if (ch === '#') break;
      if (ch === '~') {
        fogSeen += 1;
        if (fogSeen > FOG_LIMIT) break;   // the light fades out in the fog
      }
      lit.add(key(x, y));
      if (ch === 'T') { reached = true; break; }
      if (ch === '/' || ch === 'F') {   // F is a fixed "/" mirror
        // A "/" mirror swaps the direction and flips its sign.
        const old = dx;
        dx = -dy;
        dy = -old;
      } else if (ch === '\\' || ch === 'G') {   // G is a fixed "\" mirror
        // A "\" mirror swaps the direction.
        const old = dx;
        dx = dy;
        dy = old;
      }
    }
    return { lit: lit, reached: reached };
  }

  function glyph(ch) {
    if (ch === 'S') return '💡';
    if (ch === 'T') return '⚓';
    if (ch === '~') return '≈';
    if (ch === '/' || ch === 'F') return '╱';
    if (ch === '\\' || ch === 'G') return '╲';
    return '';
  }

  function render() {
    const result = traceLight();
    solved = result.reached;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const ch = grid[y][x];
        const el = cellEls[y * W + x];
        let cls = 'cell';
        if (ch === '#') cls += ' wall';
        if (ch === '~') cls += ' fog';
        if (ch === '/' || ch === '\\') cls += ' mirror';
        if (ch === 'F' || ch === 'G') cls += ' fixed';
        if (result.lit.has(key(x, y))) cls += ' lit';
        el.className = cls;
        el.textContent = glyph(ch);
      }
    }
    nextBtn.disabled = !solved;
    undoBtn.disabled = history.length === 0;
    renderLevels();
    if (solved) {
      const stars = starsFor(moves);
      if (stars > progress.stars[level]) progress.stars[level] = stars;
      progress.unlocked = Math.max(progress.unlocked, Math.min(level + 1, LEVELS.length - 1));
      saveProgress();
      infoEl.textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars) + '  Solved in ' + moves + ' moves (fewest possible: ' + PAR[level] + ')';
    } else {
      infoEl.textContent = 'Moves: ' + moves + '. Click a mirror to turn it and guide the light to the harbor.';
    }
  }

  // One button per level. Levels you haven't reached yet are locked.
  function renderLevels() {
    const box = document.getElementById('levels');
    box.innerHTML = '';
    LEVELS.forEach(function (_, i) {
      const btn = document.createElement('button');
      const locked = i > progress.unlocked;
      const stars = progress.stars[i];
      btn.className = 'level-btn' + (i === level ? ' current' : '');
      btn.disabled = locked;
      btn.innerHTML = (i + 1) + '<small>' + (locked ? '🔒' : '★'.repeat(stars) + '☆'.repeat(3 - stars)) + '</small>';
      btn.addEventListener('click', function () { loadLevel(i); });
      box.appendChild(btn);
    });
  }

  function loadLevel(n) {
    level = n;
    saveLevel(n);
    const rows = LEVELS[n];
    H = rows.length;
    W = rows[0].length;
    grid = rows.map(function (row) { return row.split(''); });
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        if (grid[y][x] === 'S') { lampX = x; lampY = y; }
      }
    }
    moves = 0;
    history = [];
    boardEl.innerHTML = '';
    boardEl.style.gridTemplateColumns = 'repeat(' + W + ', auto)';
    cellEls = [];
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const el = document.createElement('div');
        el.addEventListener('click', function () { clickCell(x, y); });
        boardEl.appendChild(el);
        cellEls.push(el);
      }
    }
    render();
  }

  function clickCell(x, y) {
    if (solved) return;
    const ch = grid[y][x];
    if (ch !== '/' && ch !== '\\') return;   // only mirrors can be turned
    history.push(grid.map(function (row) { return row.slice(); }));   // save a copy for Undo
    grid[y][x] = ch === '/' ? '\\' : '/';
    moves += 1;
    render();
  }

  resetBtn.addEventListener('click', function () { loadLevel(level); });

  undoBtn.addEventListener('click', function () {
    if (history.length === 0) return;
    grid = history.pop();
    moves -= 1;
    render();
  });

  nextBtn.addEventListener('click', function () {
    if (level + 1 < LEVELS.length) {
      loadLevel(level + 1);
    } else {
      infoEl.textContent = 'You lit every harbor! More puzzles are coming.';
    }
  });

  // ---------- Saving progress ----------
  // The browser remembers the level between visits. Some browsers block this, so every call is wrapped in try/catch.
  const SAVE_KEY = 'lightbend-level';

  function saveLevel(n) {
    try { localStorage.setItem(SAVE_KEY, String(n)); } catch (e) { /* saving is optional */ }
  }

  function savedLevel() {
    try {
      const n = Number(localStorage.getItem(SAVE_KEY));
      if (Number.isInteger(n) && n >= 0 && n < LEVELS.length) return n;
    } catch (e) { /* saving is optional */ }
    return 0;
  }

  // ---------- Progress: best stars and unlocked levels ----------
  // Saved in the browser. If saving is blocked, the game still works, it just forgets progress on reload.
  const PROGRESS_KEY = 'lightbend-progress';

  function loadProgress() {
    const fresh = { unlocked: 0, stars: LEVELS.map(function () { return 0; }) };
    try {
      const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY));
      if (saved && Number.isInteger(saved.unlocked)) {
        fresh.unlocked = Math.min(saved.unlocked, LEVELS.length - 1);
      }
      if (saved && Array.isArray(saved.stars)) {
        for (let i = 0; i < LEVELS.length; i++) fresh.stars[i] = Number(saved.stars[i]) || 0;
      }
    } catch (e) { /* saving is optional */ }
    return fresh;
  }

  function saveProgress() {
    try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); } catch (e) { /* saving is optional */ }
  }

  progress = loadProgress();
  const start = savedLevel();
  progress.unlocked = Math.max(progress.unlocked, start);
  loadLevel(start);
})();
</script>
</body>
</html>
